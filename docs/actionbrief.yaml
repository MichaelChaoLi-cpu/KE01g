analysisStructureBrief:
  overview: A two-tier descriptive planning framework combines an 11-municipality observed-demand screen with a
    matched 53-shelter analysis for Kumamoto and Yatsushiro. It separates observed evacuation and deployment fields
    from synthetic women and functional-support scenarios, then evaluates benchmark fragmentation, evidence-aware
    verification priorities, and conditional Yatsushiro rebalancing without making causal or verified functional-capacity
    claims.
  levels:
  - levelName: Evidence, linkage, and calibration audit
    levelAim: Verify that municipality, demographic, shelter, and spatial inputs can support the declared two-tier
      screening design.
    inputs:
    - Municipality
    - Municipality Observation Time
    - Open Shelter Count
    - Evacuees
    - Mesh Age-Sex Population
    - Latitude
    - Longitude
    - Shelter Location Resolution
    - Municipality Evidence Tier
    modelOrMethod: Reconcile male plus female certification counts, reproduce common-snapshot totals and city calibration
      margins, validate coordinates and catchment assignments, and calculate audit coverage as \(Q_r=M_r/A_r\),
      where \(M_r\) is the number meeting audit component \(r\) and \(A_r\) is the eligible count.
    outputs:
    - Municipality Data Coverage and Evidence Resolution Audit
    - Scenario Calibration, Catchment, and Evidence Audit
    interpretation: Passing checks supports reproducible scenario construction at the recorded evidence tier. It
      does not convert residential composition, administrative certification, or district anchors into observed
      shelter-user characteristics.
  - levelName: Prefecture-wide municipality screening
    levelAim: Compare observed sanitation demand and scope-sensitive equity demand across 11 affected municipalities.
    inputs:
    - Municipality
    - Open Shelter Count
    - Evacuees
    - Municipality Residential Female Population Share
    - Municipality Functional-Support Scope Scenario
    - Municipality Long-Term-Care Functional-Support Proxy Share
    - Municipality Female Long-Term-Care Functional-Support Proxy Share
    modelOrMethod: Calculate benchmark demand as \(R_z^{(b)}=\lceil N_z/k_b\rceil\). Estimate female and functional-support
      demand by multiplying observed evacuees by the relevant residential or certification-based share, and compare
      municipality magnitudes and ranks across Narrow, Core, and Broad scopes.
    outputs:
    - Prefecture-Wide Evacuation and Equity-Demand Screen
    - Municipality-Level Observed and Scenario Demand Summary
    interpretation: Observed evacuees determine total benchmark demand; scenario shares determine equity-weighted
      estimates. Results support municipality verification order only, not observed subgroup prevalence or within-city
      shelter adequacy.
  - levelName: Shelter equity demand and priority robustness
    levelAim: Estimate women and functional-support demand at matched shelters and test whether verification priorities
      survive overlap assumptions.
    inputs:
    - Municipality
    - District
    - Ward
    - Evacuees
    - Residential Catchment Female Share
    - Residential Catchment Functional Support Share
    - Functional-Support Overlap Scenario
    - Shelter Location Resolution
    modelOrMethod: Estimate \(\widehat{N}_{jF}=N_jq_{jF}\), \(\widehat{N}_{jU}^{(s)}=N_jq_{jU}^{(s)}\), and the
      corresponding female functional-support demand. Rank shelters lexicographically within city and across cities,
      report rank span, and select the prespecified 15-row minimax set using each shelter's worst scenario rank.
    outputs:
    - Shelter Spatial Distribution and Functional-Support Sensitivity
    - Shelter-Level Equity Demand Scenario Estimates
    - Scenario Stability of Shelter Verification Priority
    - Robust Shelter Verification Priorities across Scenarios
    - Scenario Stability of Shelter Priority Rankings
    interpretation: Occupancy and catchment shares generate planning expectations. Stable ranks justify robust field-verification
      attention, while district-anchor cases remain district-level screens and no rank estimates intervention benefit.
  - levelName: Benchmark fragmentation and operational pressure
    levelAim: Measure how sitewise rounding and reported deployable sanitation align with shelter demand and water
      context.
    inputs:
    - Municipality
    - Evacuees
    - Temporary Toilets Installed
    - Toilet Cars
    - Water Status
    - Estimated Functional Support Evacuees
    modelOrMethod: For benchmark \(b\), compute site demand \(R_j^{(b)}=\lceil N_j/k_b\rceil\), pooled and summed
      sitewise totals, and fragmentation increment. Screen \(S_j=\max(0,R_j^{(20)}-T_j)\) only where temporary-toilet
      deployment is observed, then summarize demand and pressure by water category.
    outputs:
    - From Aggregate Benchmarks to Shelter Toilet Pressure
    - Shelter Toilet Pressure and Reported Deployment
    - Aggregate and Sitewise Requirement Comparison
    - Water Status and Equity-Weighted Pressure Summary
    interpretation: Observed occupancy determines benchmark requirements and reported temporary toilets determine
      the provisional screen. Fixed stalls, toilet-car stall equivalents, wastewater operability, and service quality
      are unobserved, so the screen is not a total functional-capacity deficit.
  - levelName: Conditional rebalancing and service packages
    levelAim: Test whether reported temporary-toilet redistribution could reduce Yatsushiro screening imbalances
      under explicit mobility assumptions.
    inputs:
    - Latitude
    - Longitude
    - Shelter Location Resolution
    - Evacuees
    - Temporary Toilets Installed
    - Toilet Cars
    - Water Status
    - Estimated Female Evacuees
    - Estimated Functional Support Evacuees
    - Estimated Female Functional Support Evacuees
    - Accessible Unit Parity Screen
    modelOrMethod: Apply a priority-constrained nearest-donor algorithm with integer flows \(x_{ij}^{(m)}\), donor
      protection, unit conservation, and residual shortfall \(U_j^{(m)}\). Compare no movement, zero-occupancy donors,
      and full reported-surplus mobility; allocate incremental general units approximately 3:1 to women and men
      while keeping accessible parity separate.
    outputs:
    - Provisional Toilet Rebalancing and Mobility-Scenario Performance
    - Gender and Functional-Support Toilet Service Packages
    - Shelter-Level Provisional Toilet Rebalancing Plan
    - Priority Shelter Gender and Accessible Service Packages
    - Toilet Rebalancing Scenario Performance and Robustness
    interpretation: Scenario assumptions determine eligible donor stock and apparent coverage. Movements and service
      packages remain conditional on equipment, road, setup, containment, waste collection, lighting, locks, handwashing,
      menstrual-waste support, and accessible-route verification; they are not dispatch orders or a global optimum.
