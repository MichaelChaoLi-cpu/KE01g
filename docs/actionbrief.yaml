      and remains separate from ordinary stalls. Role: scenario verification input.'
    variableSource: shelter_equity_scenarios
    observationNumber: 159
  location_resolution:
    variableNameInDataset: Location Resolution
    variableNameInArticle: Shelter Location Resolution
    variableAttribute: categorical
    variableUnit: not applicable
    variableDescription: 'Categorical evidence level for the coordinates or catchment anchor assigned to shelter
